<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>garciabletna</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 414px; height: 100vh; max-height: 896px; background: #000; display: flex; flex-direction: column; position: relative; overflow: hidden; border: 1px solid #222; }
        
        /* Gestion des Vues (Empêche la superposition) */
        .view { flex: 1; overflow-y: auto; display: none; padding-bottom: 75px; }
        .view.active { display: flex; flex-direction: column; }

        /* 1. Écran de Connexion (Conforme à tes captures) */
        #login-view { justify-content: center; align-items: center; padding: 30px; text-align: center; }
        .logo-login { font-size: 32px; font-weight: bold; color: #00ff66; font-style: italic; text-shadow: 0 0 15px rgba(0,255,102,0.6); margin-bottom: 30px; }
        .select-lang { width: 100%; background: #121212; border: 1px solid #333; padding: 14px; border-radius: 10px; color: #fff; margin-bottom: 15px; font-size: 16px; outline: none; }
        .input-box { width: 100%; background: #121212; border: 1px solid #333; padding: 14px; border-radius: 10px; color: #fff; margin-bottom: 15px; font-size: 16px; outline: none; }
        .input-box:focus { border-color: #00ff66; box-shadow: 0 0 8px rgba(0,255,102,0.4); }
        .btn-salon { width: 100%; background: #00ff66; color: #000; font-weight: bold; padding: 14px; border-radius: 10px; border: none; font-size: 16px; cursor: pointer; box-shadow: 0 0 15px rgba(0,255,102,0.4); display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-salon:active { transform: scale(0.98); }
        .security-footer { font-size: 10px; color: #666; text-align: center; margin-top: 40px; line-height: 1.5; }

        /* 2. Profil (Conforme aux images 2, 3 et 4) */
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a1a; }
        .logo-header { font-size: 22px; font-weight: bold; color: #00ff66; font-style: italic; text-shadow: 0 0 8px rgba(0,255,102,0.4); }
        .profile-header { padding: 20px; display: flex; align-items: center; gap: 20px; }
        .avatar-container { position: relative; width: 85px; height: 85px; border-radius: 50%; background: linear-gradient(45deg, #00ff66, #00ffff); padding: 3px; cursor: pointer; box-shadow: 0 0 10px rgba(0,255,102,0.3); }
        .avatar { width: 100%; height: 100%; background: #1a1a1a; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .profile-info { flex: 1; }
        .username-row { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: bold; margin-bottom: 5px; color: #fff; }
        
        .stats-bar { display: flex; justify-content: space-around; padding: 15px 20px; border-top: 1px solid #1a1a1a; border-bottom: 1px solid #1a1a1a; text-align: center; }
        .stat-num { font-weight: bold; color: #00ff66; font-size: 16px; text-shadow: 0 0 5px rgba(0,255,102,0.3); }
        .stat-label { font-size: 12px; color: #888; }
        
        .profile-actions { display: flex; gap: 10px; padding: 15px 20px; }
        .btn-action { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; }
        .btn-action:hover { border-color: #00ff66; }
        
        /* Grille des posts dynamique avec le bouton + (Fin des Post 1, 2, 3 statiques) */
        .posts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; }
        .post-box { aspect-ratio: 1; background: #121212; display: flex; align-items: center; justify-content: center; color: #00ff66; font-size: 12px; border: 1px dashed #333; text-align: center; padding: 5px; word-break: break-all; }
        .add-post-btn { background: #0a0a0a; color: #00ff66; font-size: 32px; cursor: pointer; border: 1px dashed #00ff66; display: flex; align-items: center; justify-content: center; aspect-ratio: 1; border-radius: 4px; transition: 0.2s; }
        .add-post-btn:hover { background: rgba(0,255,102,0.1); }

        /* 3. Chat intelligent et vérifié par serveur local */
        .chat-area { padding: 15px; flex: 1; display: flex; flex-direction: column; }
        .chat-box { flex: 1; background: #080808; border-radius: 10px; padding: 15px; border: 1px solid #1a1a1a; margin-bottom: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 10px; max-width: 80%; font-size: 14px; word-break: break-word; }
        .message.sent { background: #00ff66; color: #000; align-self: flex-end; font-weight: 500; }
        .message.received { background: #1a1a1a; color: #fff; align-self: flex-start; border: 1px solid #333; }

        /* 4. Appels Modernes */
        .call-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .call-avatar { width: 110px; height: 110px; border-radius: 50%; background: #1a1a1a; border: 2px solid #00ff66; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 20px; color: #00ff66; box-shadow: 0 0 20px rgba(0,255,102,0.3); }
        .call-buttons { display: flex; gap: 30px; margin-top: 30px; }
        .call-btn { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .call-btn.accept { background: #00ff66; color: #000; box-shadow: 0 0 10px rgba(0,255,102,0.5); }
        .call-btn.hangup { background: #ff3b30; color: #fff; box-shadow: 0 0 10px rgba(255,59,48,0.5); }

        /* 5. Barre de navigation inférieure avec icônes en NÉON VERT */
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 65px; background: #000; border-top: 1px solid #1a1a1a; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { background: none; border: none; color: #666; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.2s; }
        .nav-item.active { color: #00ff66; text-shadow: 0 0 8px rgba(0,255,102,0.6); }
        .nav-item.active svg { filter: drop-shadow(0 0 6px #00ff66); }
        .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- VUE 1 : CONNEXION (S'affiche par défaut si pas connecté) -->
    <div id="login-view" class="view">
        <div class="logo-login">garcia bletna</div>
        <select class="select-lang" id="lang-select">
            <option value="fr">Français</option>
            <option value="en">English</option>
        </select>
        <input type="text" id="pseudo-input" class="input-box" placeholder="Entre ton pseudo...">
        <button class="btn-salon" onclick="registerUser()">🔱 Rejoindre le Salon</button>
        <div class="security-footer">
            PROPRIÉTÉ DE GARCIABLETNA — FONDATEUR<br>
            Protocole de sécurité 2026. Chiffrement de bout en bout, compatibilité VPN active et respect des normes de confidentialité strictes.
        </div>
    </div>

    <!-- VUE 2 : ACCUEIL / PROFIL -->
    <div id="home-view" class="view">
        <header>
            <div class="logo-header" id="header-pseudo">garciabletna</div>
            <span style="font-size: 22px; cursor: pointer;" onclick="alert('Aucune nouvelle notification.')">❤️</span>
        </header>

        <div class="profile-header">
            <div class="avatar-container" onclick="addStory()">
                <div class="avatar">
                    <span style="font-size: 32px;">👤</span>
                </div>
            </div>
            <div class="profile-info">
                <div class="username-row">
                    <span id="profile-pseudo-title">garciabletna</span>
                    <span style="font-size: 14px; color: #00ff66;">⚡</span>
                </div>
                <div style="font-size: 11px; color: #888;">Appuyez sur la photo pour modifier</div>
            </div>
        </div>

        <div class="stats-bar">
            <div>
                <div class="stat-num" id="stat-posts">0</div>
                <div class="stat-label">publications</div>
            </div>
            <div>
                <div class="stat-num" id="stat-followers">X</div>
                <div class="stat-label">abonnés</div>
            </div>
            <div>
                <div class="stat-num" id="stat-following">142</div>
                <div class="stat-label">suivis</div>
            </div>
        </div>

        <div class="profile-actions">
            <button class="btn-action" onclick="editProfileName()">Modifier profil</button>
            <button class="btn-action" id="follow-btn" onclick="toggleFollow()">S'abonner</button>
        </div>

        <!-- Grille dynamique des publications avec le bouton d'ajout (+) -->
        <div class="posts-grid" id="posts-grid-container">
            <div class="add-post-btn" onclick="createNewPost()">+</div>
        </div>
    </div>

    <!-- VUE 3 : DISCUSSION / CHAT -->
